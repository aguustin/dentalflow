<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Velatrix One · Clinic</title>
    <script>
      // Apply Clinic's saved appearance before the first paint (no flash). Keys: design-system/theme.ts.
      try {
        var t = localStorage.getItem('velatrix.clinic.theme') || localStorage.getItem('velatrix.theme')
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t)
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
